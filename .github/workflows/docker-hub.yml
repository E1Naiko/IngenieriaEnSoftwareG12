name: Tests, build y Docker Hub

# Tests y build en CUALQUIER rama y en los pull requests. La publicación en
# Docker Hub es opcional en ramas de desarrollo y automática solo en main.
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar la imagen en Docker Hub (además de construirla)"
        type: boolean
        default: false
      check_credentials:
        description: "Solo validar DOCKERHUB_USERNAME y DOCKERHUB_TOKEN contra Docker Hub, sin publicar"
        type: boolean
        default: false

permissions:
  contents: read

# En development cancelamos corridas viejas de la misma rama; en main no, para
# no interrumpir una publicación de `latest` a mitad de camino.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  config:
    name: Calcular tags y decidir publicación
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      repository: ${{ steps.decide.outputs.repository }}
      tag_specs: ${{ steps.decide.outputs.tag_specs }}
      tags_list: ${{ steps.decide.outputs.tags_list }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      REF: ${{ github.ref }}
      # En un PR la rama de origen está en head_ref; ref_name sería "N/merge".
      BRANCH_RAW: ${{ github.head_ref || github.ref_name }}
      SHA: ${{ github.sha }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
      DISPATCH_PUBLISH: ${{ github.event.inputs.publish || 'false' }}
      PUBLISH_DEV: ${{ vars.DOCKERHUB_PUBLISH_DEV || 'false' }}
      REPOSITORY_NAME: ${{ vars.DOCKERHUB_REPOSITORY || 'ingenieria-en-software-g12-backend' }}
    steps:
      - name: Calcular
        id: decide
        shell: bash
        run: |
          set -euo pipefail

          # Docker admite tags de hasta 128 caracteres: [\w][\w.-]*. La rama
          # se normaliza (ej. "arena/mi-rama" -> "arena-mi-rama") y se limita
          # para dejar lugar al prefijo "dev-" y al SHA.
          branch=$(printf '%s' "$BRANCH_RAW" | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/^[-.]+//; s/[-.]+$//')
          [ -n "$branch" ] || branch="sin-rama"
          branch=$(printf '%s' "$branch" | cut -c1-80 | sed -E 's/[-.]+$//')
          sha7=$(printf '%s' "$SHA" | cut -c1-7)

          if ! printf '%s' "$REPOSITORY_NAME" | grep -Eq '^[a-z0-9][a-z0-9._-]{0,99}$'; then
            echo "::error::La variable DOCKERHUB_REPOSITORY debe contener solo minúsculas, números, '.', '_' o '-' (sin el usuario)."
            exit 1
          fi

          # `latest` queda reservado para main. En las demás ramas el tag
          # identifica rama y commit: dev-<rama>-<sha7>.
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$REF" != "refs/heads/main" ]; then
            tags=("dev-${branch}-${sha7}")
            is_main=false
          else
            tags=("latest" "main-${sha7}")
            is_main=true
          fi

          publish=false
          reason="sin publicación (solo tests y build)"
          case "$EVENT_NAME" in
            pull_request)
              reason="los pull requests nunca publican, aunque el commit lleve la marca"
              ;;
            push)
              if [ "$is_main" = true ]; then
                publish=true
                reason="push/merge en main"
              elif printf '%s' "$COMMIT_MESSAGE" | grep -Eiq '\[(publicar-imagen|publish-image)\]'; then
                publish=true
                reason="marca [publicar-imagen] en el mensaje del commit"
              elif [ "$(printf '%s' "$PUBLISH_DEV" | tr '[:upper:]' '[:lower:]')" = "true" ]; then
                # Alternativa al Run workflow, que solo existe cuando el YAML
                # ya está en la rama por defecto.
                publish=true
                reason="variable de repositorio DOCKERHUB_PUBLISH_DEV=true"
              fi
              ;;
            workflow_dispatch)
              if [ "$(printf '%s' "$DISPATCH_PUBLISH" | tr '[:upper:]' '[:lower:]')" = "true" ]; then
                publish=true
                reason="ejecución manual con publish=true"
              fi
              ;;
          esac

          {
            echo "publish=$publish"
            echo "repository=$REPOSITORY_NAME"
            echo 'tag_specs<<EOF'
            printf 'type=raw,value=%s\n' "${tags[@]}"
            echo 'EOF'
            echo 'tags_list<<EOF'
            printf '%s\n' "${tags[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Decisión del workflow"
            echo
            echo "- Evento: \`$EVENT_NAME\`"
            echo "- Rama: \`$BRANCH_RAW\` (normalizada: \`$branch\`)"
            echo "- Commit: \`$sha7\`"
            echo "- Publicar: **$publish** ($reason)"
            echo "- Tags previstos: $(printf '\`%s\` ' "${tags[@]}")"
            if [ "$publish" = true ]; then
              echo "- Destino: \`<usuario>/$REPOSITORY_NAME\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Tests del backend con SQLite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: ""
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: solo-tests-de-github-actions

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar configuración de Django
        run: python manage.py check

      - name: Verificar migraciones
        run: python manage.py makemigrations --check --dry-run

      - name: Ejecutar tests
        run: python manage.py test

  build:
    name: Construir y probar la imagen (sin publicar)
    needs: [config, test]
    runs-on: ubuntu-latest
    env:
      # Tag fijo local: en este job NO se usan secretos de Docker Hub y no
      # dependemos de cómo metadata-action normalice el nombre del repositorio.
      IMAGE: backend-ci:local

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generar metadatos y tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.config.outputs.repository }}
          tags: ${{ needs.config.outputs.tag_specs }}
          flavor: latest=false

      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            backend-ci:local
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # Los PR (sobre todo de forks) no siempre pueden exportar caché.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

      - name: Verificar Django dentro de la imagen
        run: |
          docker run --rm \
            -e DB_HOST= \
            -e DJANGO_DEBUG=False \
            -e DJANGO_SECRET_KEY=solo-build-de-github-actions \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            "$IMAGE" python manage.py check

      - name: Probar /api/ping/ en la imagen
        run: |
          set -euo pipefail
          trap 'docker rm -f backend-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name backend-ci -p 8000:8000 \
            -e DB_HOST= \
            -e DJANGO_DEBUG=False \
            -e DJANGO_SECRET_KEY=solo-build-de-github-actions \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            "$IMAGE"
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/api/ping/; then
              echo
              echo "La imagen responde correctamente."
              exit 0
            fi
            sleep 2
          done
          echo "::error::La imagen no respondió en /api/ping/"
          docker logs backend-ci || true
          exit 1

  publish:
    name: Publicar imagen en Docker Hub
    needs: [config, test, build]
    if: needs.config.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Verificar que los secretos estén configurados
        run: |
          set -euo pipefail
          faltan=0
          if [ -z "${DOCKERHUB_USERNAME:-}" ]; then
            echo "::error::Falta el repository secret DOCKERHUB_USERNAME (Settings → Secrets and variables → Actions)."
            faltan=1
          fi
          if [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "::error::Falta el repository secret DOCKERHUB_TOKEN. Crear un access token de Docker Hub con permiso de escritura."
            faltan=1
          fi
          if [ "$faltan" -ne 0 ]; then
            echo "Los valores nunca se muestran en los logs; este paso solo comprueba que existan."
            exit 1
          fi
          echo "DOCKERHUB_USERNAME y DOCKERHUB_TOKEN están definidos (solo se comprueba su presencia)."

      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generar metadatos y tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ needs.config.outputs.repository }}
          tags: ${{ needs.config.outputs.tag_specs }}
          flavor: latest=false

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen de publicación
        env:
          REPOSITORY: ${{ needs.config.outputs.repository }}
          TAGS_LIST: ${{ needs.config.outputs.tags_list }}
        run: |
          {
            echo "### Imagen publicada"
            echo
            echo "Repositorio \`$REPOSITORY\` (usuario tomado de \`DOCKERHUB_USERNAME\`)."
            echo
            echo 'Tags:'
            echo
            echo '```text'
            printf '%s\n' "$TAGS_LIST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  check-credentials:
    name: Verificar credenciales de Docker Hub (sin publicar)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.check_credentials == 'true'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Comprobar presencia de los secretos
        run: |
          set -euo pipefail
          faltan=0
          if [ -z "${DOCKERHUB_USERNAME:-}" ]; then
            echo "::error::Falta el repository secret DOCKERHUB_USERNAME."
            faltan=1
          else
            echo "DOCKERHUB_USERNAME: configurado."
          fi
          if [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "::error::Falta el repository secret DOCKERHUB_TOKEN."
            faltan=1
          else
            echo "DOCKERHUB_TOKEN: configurado."
          fi
          [ "$faltan" -eq 0 ] || exit 1

      - name: Validar usuario y token contra Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true

      - name: Resultado
        run: |
          echo "Login correcto: el usuario y el access token son válidos." >> "$GITHUB_STEP_SUMMARY"
          echo "Para comprobar el permiso de escritura, ejecutar el workflow con publish=true." >> "$GITHUB_STEP_SUMMARY"
