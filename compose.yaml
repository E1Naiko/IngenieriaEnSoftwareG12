name: ingenieria-software-g12

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ingenieria-en-software-g12-backend:dev
    ports:
      - "8000:8000"
    # Compose es opcional para desarrollo; usa las credenciales del proyecto
    # Supabase de desarrollo configuradas en backend/.env.
    env_file:
      - ./backend/.env
    environment:
      DATABASE_MODE: postgres
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
    volumes:
      - media_data:/app/media
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ping/', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  media_data:
